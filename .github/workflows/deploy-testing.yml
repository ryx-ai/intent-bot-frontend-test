name: Deploy to Testing Environment

on:
  push:
    branches: [aravind]
  workflow_dispatch:

jobs:
  sync-to-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.TEST_REPO_SSH_KEY }}

      - name: Push to test repository
        run: |
          # Add the test repository as a remote using the SSH URL
          git remote add test-repo git@github.com:ryx-ai/intent-bot-frontend-test.git
          
          # Force push the current branch (aravind) to the test repository's main branch
          git push test-repo HEAD:main --force
