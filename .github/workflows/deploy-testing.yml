name: Deploy to Testing Environment

on:
  push:
    branches: [aravind]
  workflow_dispatch:

jobs:
  sync-to-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to test repository
        env:
          TEST_REPO_PAT: ${{ secrets.TEST_REPO_PAT }}
        run: |
          # Remove the credential helper that actions/checkout sets up,
          # otherwise it overrides our PAT with the default GITHUB_TOKEN
          # which only has access to this repository.
          git config --unset-all http.https://github.com/.extraheader || true
          
          # Add the test repository as a remote using the PAT for authentication
          git remote add test-repo https://${TEST_REPO_PAT}@github.com/ryx-ai/intent-bot-frontend-test.git
          
          # Force push the current branch (aravind) to the test repository's main branch
          git push test-repo HEAD:main --force
